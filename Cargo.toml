[package]
name = "smol-utils"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gitscan"
path = "src/bin/gitscan.rs"

[[bin]]
name = "is-published"
path = "src/bin/is_published.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
